{% set name = "pytest-benchmark" %}
{% set version = "5.2.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-benchmark/pytest_benchmark-5.2.3.tar.gz
  sha256: deb7317998a23c650fd4ff76e1230066a76cb45dcece0aca5607143c619e7779

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - py.test-benchmark = pytest_benchmark.cli:main
    - pytest-benchmark = pytest_benchmark.cli:main

requirements:
  host:
    - python
    - setuptools >=80
    - pip
  run:
    - python
    - pytest >=8.1
    - py-cpuinfo

# E AssertionError: assert 'main' == 'master'
{% set deselect_tests = " --deselect=tests/test_utils.py::test_get_commit_info" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_utils.py::test_get_branch_info" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_utils.py::test_commit_info_error" %}
# ModuleNotFoundError: No module named 'pygal'
{% set ignore_tests = " --ignore=tests/test_cli.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_storage.py" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_benchmark.py::test_histogram" %}
# E ModuleNotFoundError: No module named 'aspectlib'
{% set deselect_tests = deselect_tests + " --deselect=tests/test_with_weaver.py::test_weave_fixture" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_with_weaver.py::test_weave_method" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_with_testcase.py::TerribleTerribleWayToWritePatchTests::test_foo2" %}

test:
  source_files:
    - tests
  imports:
    - pytest_benchmark
  requires:
    - pip
    - pytest
    - elasticsearch
    - freezegun
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest tests {{ ignore_tests }} {{ deselect_tests }}
    - py.test-benchmark --help
    - pytest-benchmark --help

about:
  home: https://github.com/ionelmc/pytest-benchmark
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A pytest fixture for benchmarking code
  description: |
    A pytest fixture for benchmarking code. It will group the tests by the fixture name and will run them with different number of iterations. It will also group the tests by the fixture name and will run them with different number of iterations. It will also group the tests by the fixture name and will run them with different number of iterations. It will also group the tests by the fixture name and will run them with different number of iterations.
  dev_url: https://github.com/ionelmc/pytest-benchmark
  doc_url: https://pytest-benchmark.readthedocs.io

extra:
  recipe-maintainers:
    - juanlu001
